<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCMF LF2</title>
<meta name="description" content="Basket Club Montbrison Féminin — équipe LF2" />
<link rel="icon" href="favicon.png" />
<!--
  Page autonome — 3 fichiers nécessaires, à garder dans le même dossier :
    - lf2-intro.html  (ce fichier)
    - lf2-video.mp4   (vidéo de fond, extrait joué en boucle de 0s à 8s)
    - logo-bcmf.svg   (logo du club)
  La vidéo démarre muette (obligatoire pour l'autoplay sur mobile) ;
  l'utilisateur peut activer le son via le bouton 🔇 en bas à gauche.
  Redirection automatique vers bcmf.sportsregions.fr après ~9s.
-->
<!-- Filet de sécurité si JS est désactivé : redirection forcée à 10s -->
<meta http-equiv="refresh" content="10;url=https://bcmf.sportsregions.fr" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    position: relative;
  }

  /* ── Vidéo plein écran en fondu ── */
  #bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(.8);
    opacity: 0;
    animation: fadeIn 1.6s ease forwards;
  }

  /* Fond de secours tant qu'il n'y a pas de vidéo (dégradé vert animé) */
  #fallbackBg {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, #16a34a 0%, #14532d 45%, #052e16 100%);
    background-size: 160% 160%;
    opacity: 0;
    animation: fadeIn 1.6s ease forwards, drift 8s ease-in-out infinite;
    display: none;
  }
  body.no-video #fallbackBg { display: block; }
  body.no-video #bgVideo { display: none; }

  /* Voile sombre pour garder le logo lisible quel que soit le contenu vidéo */
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
  }

  /* Fondu vert aux couleurs du club, progressif pendant le zoom du logo */
  .green-wash {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #16a34a 0%, #14532d 100%);
    opacity: 0;
    pointer-events: none;
    animation: greenWashIn 7s ease .9s forwards;
    will-change: opacity;
  }

  /* ── Logo : apparition au centre puis zoom jusqu'à couvrir toute la page ── */
  .logo {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(38vw, 190px);
    transform: translate(-50%, -50%) scale(.7);
    opacity: 0;
    filter: drop-shadow(0 6px 28px rgba(0,0,0,.55));
    --logo-final-scale: 2.3; /* repli sûr si le calcul JS échoue — recalculé précisément au chargement */
    animation: logoIn 7s cubic-bezier(.16,1,.3,1) .9s forwards;
    will-change: transform, opacity; /* évite les à-coups (jank) en fin de zoom */
  }
  .logo img { width: 100%; display: block; }

  /* ── Fondu de sortie global avant redirection ── */
  .fade-out {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease;
    z-index: 5;
  }
  .fade-out.active { opacity: 1; }

  .skip {
    position: fixed;
    right: 18px;
    bottom: 16px;
    z-index: 6;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,.45);
    text-decoration: none;
    letter-spacing: .3px;
    opacity: 0;
    animation: fadeIn .8s ease 2s forwards;
  }
  .skip:hover { color: rgba(255,255,255,.8); }

  .sound-toggle {
    position: fixed;
    left: 18px;
    bottom: 16px;
    z-index: 6;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.25);
    color: rgba(255,255,255,.85);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn .8s ease 2s forwards;
  }
  .sound-toggle:hover { background: rgba(0,0,0,.4); }
  body.no-video .sound-toggle { display: none; }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes logoIn {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    22%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    45%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(var(--logo-final-scale)); }
  }
  @keyframes greenWashIn {
    0%, 45% { opacity: 0; }
    100%    { opacity: 1; }
  }
  @keyframes drift {
    0%, 100% { background-position: 50% 50%; }
    50%      { background-position: 55% 45%; }
  }
</style>
</head>
<body>

  <video id="bgVideo" autoplay muted playsinline>
    <source src="lf2-video.mp4" type="video/mp4" />
  </video>
  <div id="fallbackBg"></div>
  <div class="vignette"></div>
  <div class="green-wash"></div>

  <div class="logo">
    <img src="logo-bcmf.svg" alt="BCMF" />
  </div>

  <a href="https://bcmf.sportsregions.fr" class="skip" id="skipLink">passer</a>
  <button type="button" class="sound-toggle" id="soundToggle" aria-label="Activer le son">🔇</button>
  <div class="fade-out" id="fadeOut"></div>

<script>
  var REDIRECT_URL = "https://bcmf.sportsregions.fr";
  var MAX_MS = 8400; // + 600ms de fondu = redirection vers ~9s
  var CLIP_START = 0; // ne garder que le passage entre 0s et 8s de la vidéo source
  var CLIP_END   = 8;
  var redirected = false;

  var video   = document.getElementById("bgVideo");
  var fadeOut = document.getElementById("fadeOut");
  var logoEl  = document.querySelector(".logo");
  var logoImg = logoEl.querySelector("img");

  // Le logo, en zoom max, vise la taille de celui incrusté nativement à la
  // fin de lf2-video.mp4 (mesuré par analyse pixel : ~61% de la largeur de
  // l'image vidéo), réduite de 30% sur demande pour un rendu moins massif.
  var VIDEO_LOGO_WIDTH_RATIO = 0.61;
  var VIDEO_DISPLAY_SCALE    = 0.8; // suit le CSS: #bgVideo { transform: scale(.8) }
  var FINAL_SIZE_ADJUST      = 1; // taille de référence exacte de la vidéo, sans ajustement
  function setLogoFinalScale() {
    var naturalW = logoImg.naturalWidth, naturalH = logoImg.naturalHeight;
    if (!naturalW || !naturalH) return;
    var baseW = Math.min(window.innerWidth * 0.38, 190); // suit le CSS: min(38vw, 190px)
    var targetWidthPx = VIDEO_LOGO_WIDTH_RATIO * VIDEO_DISPLAY_SCALE * window.innerWidth * FINAL_SIZE_ADJUST;
    var scale = targetWidthPx / baseW;
    logoEl.style.setProperty("--logo-final-scale", scale.toFixed(2));
  }
  // Plusieurs points d'accroche pour garantir que le calcul s'applique,
  // quel que soit l'ordre/la vitesse de chargement sur le poste du visiteur.
  setLogoFinalScale();
  logoImg.addEventListener("load", setLogoFinalScale);

  // Une fois le zoom terminé, on fige la taille en dur (transform statique)
  // et on arrête l'animation : plus aucun recalcul tardif de
  // --logo-final-scale (image lente à charger, etc.) ne peut alors faire
  // "sauter" la taille du logo juste avant la redirection.
  logoEl.addEventListener("animationend", function (e) {
    if (e.animationName !== "logoIn") return;
    var cs = getComputedStyle(logoEl);
    logoEl.style.transform  = cs.transform;
    logoEl.style.opacity    = cs.opacity;
    logoEl.style.animation  = "none";
  });

  // Pas de fichier vidéo déposé (ou erreur de lecture) → fond dégradé de secours
  video.addEventListener("error", function () { document.body.classList.add("no-video"); }, true);
  setTimeout(function () {
    if (video.readyState === 0) document.body.classList.add("no-video");
  }, 1000);

  // Ne joue que l'extrait 4s→8s de la vidéo, en boucle sur cet extrait
  video.addEventListener("loadedmetadata", function () {
    try { video.currentTime = CLIP_START; } catch (e) {}
  });
  video.addEventListener("timeupdate", function () {
    if (video.currentTime >= CLIP_END) video.currentTime = CLIP_START;
  });

  function goToSportsRegions() {
    if (redirected) return;
    redirected = true;
    fadeOut.classList.add("active");
    setTimeout(function () {
      window.location.href = REDIRECT_URL;
    }, 600);
  }

  document.getElementById("skipLink").addEventListener("click", function (e) {
    e.preventDefault();
    goToSportsRegions();
  });

  // Le son démarre coupé (nécessaire pour garantir l'autoplay sur mobile) —
  // ce bouton permet à l'utilisateur de l'activer/couper manuellement.
  document.getElementById("soundToggle").addEventListener("click", function () {
    video.muted = !video.muted;
    this.textContent = video.muted ? "🔇" : "🔊";
    this.setAttribute("aria-label", video.muted ? "Activer le son" : "Couper le son");
  });

  setTimeout(goToSportsRegions, MAX_MS);
</script>

</body>
</html>
